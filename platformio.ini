; PlatformIO Project Configuration File
;
; Two environments, because the project targets both Pico generations. Build a specific one with
; `pio run -e pico2`, or both with `pio run`. The default is the RP2350 board the current
; prototype uses.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico2

; Raspberry Pi Pico 2 (RP2350).
;
; The official `platform = raspberrypi` does not support RP2350, so this uses the community
; platform with earlephilhower's Arduino core. The firmware needs nothing beyond analogWrite,
; Serial, pinMode, millis and attachInterrupt, all of which that core provides, so no source
; changes were required to move across.
[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

; Raspberry Pi Pico (RP2040), the original target. Kept so existing boards stay buildable.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
